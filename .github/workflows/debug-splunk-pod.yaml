# TEMPORARY DIAGNOSTIC — delete after the splunk-pod sudo/PAM failure is resolved.
#
# The func-test splunk pod fails ansible's first task on GitHub runners with
#   sudo: PAM account management error: Authentication service cannot retrieve authentication info
# under BOTH minikube runtimes (docker://29, containerd), while the identical pod spec provisions
# cleanly on a local kind cluster and in plain docker run. This workflow reproduces the CI
# environment and dumps the low-level facts that differ (setuid, NoNewPrivs, seccomp, caps,
# uid_map, mount flags, pam/sudo versions) so the fix targets the mechanism, not a guess.
name: Debug splunk pod sudo

on:
  workflow_dispatch:

env:
  KUBERNETES_VERSION: v1.34.11
  MINIKUBE_VERSION: v1.38.1

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Start minikube (same pins as func-test)
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -Lo minikube https://storage.googleapis.com/minikube/releases/${MINIKUBE_VERSION}/minikube-linux-amd64
          chmod +x minikube && sudo mv minikube /usr/local/bin/
          minikube start --driver=docker --container-runtime=containerd --cpus 2 --memory 4096 --kubernetes-version=${KUBERNETES_VERSION} --no-vtx-check -n=1
          kubectl wait --for=condition=Ready node --all --timeout=300s

      - name: Debug pod diagnostics
        run: |
          cat > /tmp/dbg.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: splunk-debug
          spec:
            hostNetwork: true
            containers:
            - name: dbg
              image: splunk/splunk:latest
              command: ["sleep", "900"]
          EOF
          kubectl apply -f /tmp/dbg.yaml
          kubectl wait --for=condition=Ready pod/splunk-debug --timeout=300s
          kubectl exec splunk-debug -- bash -c '
            echo "== id:"; id
            echo "== apparmor label:"; cat /proc/self/attr/current 2>/dev/null || echo "(absent)"
            echo "== securebits/ambient:"; grep -E "SecBits|CapAmb|NoNewPrivs|Seccomp:" /proc/self/status
            echo "== THE TEST — sudo -n id:"
            sudo -n id; echo "sudo rc=$?"
          ' || true

          # Root pod: strace the failing sudo from a user context, so the exact syscall that
          # returns the error is visible. This is the ground-truth probe.
          cat > /tmp/dbg-root.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: splunk-debug-root
          spec:
            hostNetwork: true
            containers:
            - name: dbg
              image: splunk/splunk:latest
              command: ["sleep", "900"]
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: ["SYS_PTRACE"]
          EOF
          kubectl apply -f /tmp/dbg-root.yaml
          kubectl wait --for=condition=Ready pod/splunk-debug-root --timeout=300s
          kubectl exec splunk-debug-root -- bash -c '
            echo "== root id:"; id
            echo "== ROOT FILESYSTEM TYPE (the suspect):"
            stat -f -c "fstype=%T" /
            awk "\$5==\"/\"" /proc/self/mountinfo
            echo "== can root read the mode-000 shadow?"
            getent shadow root >/dev/null; echo "getent shadow rc=$?"
            head -c 20 /etc/shadow >/dev/null 2>&1; echo "direct read rc=$?"
            echo "== root sudo test:"; sudo -n id; echo "rc=$?"
            microdnf -y install strace >/dev/null 2>&1 || dnf -y install strace >/dev/null 2>&1 || yum -y install strace >/dev/null 2>&1
            echo "== strace tail of failing sudo (unfiltered file trace):"
            strace -f -qq -s 200 -e trace=file -o /tmp/tr sudo -n id 2>&1 | tail -2
            grep -E "shadow|EACCES|EPERM" /tmp/tr | tail -20
          ' || true
          echo "== node info:"
          kubectl get nodes -o wide
